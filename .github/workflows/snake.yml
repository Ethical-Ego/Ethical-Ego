name: Generate Contribution Snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: Ethical-Ego
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#00E5FF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00E5FF

      - name: Publish generated assets
        uses: crazy-max/ghaction-github-pages@v5
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
